{% extends "proxy/base.html" %}
{% block title %}Sign in · LLM Proxy Logs{% endblock %}
{% block content %}
<h1>Sign in</h1>
<section class="panel" style="max-width:420px">
  {% if form.errors %}<p role="alert">Username or password was not accepted.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username{{ form.username }}</label>
    <label style="margin-top:12px">Password{{ form.password }}</label>
    <button type="submit" style="margin-top:16px">Sign in</button>
  </form>
</section>
{% endblock %}
